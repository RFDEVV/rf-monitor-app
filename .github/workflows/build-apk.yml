name: Build Release APK

# Versi Flutter DIKUNCI ke 3.22.3 — sama dengan pubspec.yaml (environment.flutter),
# Gradle 8.4 dan AGP 8.3.2 di folder android/. Memakai "stable" tanpa versi akan
# mengambil Flutter terbaru yang mensyaratkan Gradle 8.14+ dan membuat build gagal
# ("Your project's Gradle version (8.4.0) is lower than Flutter's minimum ...").
env:
  FLUTTER_VERSION: '3.22.3'
  JAVA_VERSION: '17'

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versi toolchain
        run: |
          flutter --version
          java -version
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Ambil dependensi
        run: flutter pub get

      # Ukuran kecil:
      #  --split-per-abi   : satu APK per arsitektur (bukan satu APK gemuk berisi semuanya)
      #  --target-platform : hanya arm64 (HP modern) + arm32 (HP lama); x86 untuk emulator tidak ikut
      #  --obfuscate + --split-debug-info : kode Dart lebih kecil, simbol dipisah
      - name: Build Release APK
        run: >
          flutter build apk --release
          --split-per-abi
          --target-platform android-arm,android-arm64
          --obfuscate
          --split-debug-info=build/symbols

      - name: Ukuran APK
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APK arm64 (HP modern — pakai ini)
        uses: actions/upload-artifact@v4
        with:
          name: rfmonitor-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK arm32 (HP lama)
        uses: actions/upload-artifact@v4
        with:
          name: rfmonitor-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      # Diperlukan untuk membaca stack trace hasil obfuscate (flutter symbolize)
      - name: Upload simbol debug
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
